[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "racecoach"
version = "0.1.0"
description = "Local driving training control center"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
hardware = ["pyserial>=3.5", "hidapi>=0.14"]

[project.scripts]
racecoach = "racecoach.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
racecoach = ["ac/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
