[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "racecoach-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
hardware = ["pyserial>=3.5", "hidapi>=0.14"]
overlay = ["PySide6>=6.6"]

[project.scripts]
racecoach-agent = "racecoach_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
racecoach_agent = ["csp/racecoach/*", "overlay/static/*", "acapps/*/*.py"]
